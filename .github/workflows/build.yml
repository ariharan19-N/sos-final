name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download offline voice model
        run: |
          set -e
          cd /tmp
          if wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip; then
            unzip -q vosk-model-small-en-in-0.4.zip
            MODEL_DIR=vosk-model-small-en-in-0.4
          else
            wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
            unzip -q vosk-model-small-en-us-0.15.zip
            MODEL_DIR=vosk-model-small-en-us-0.15
          fi
          DEST="$GITHUB_WORKSPACE/app/src/main/assets/model"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r "$MODEL_DIR"/* "$DEST"/
          cat /proc/sys/kernel/random/uuid > "$DEST/uuid"
          ls -la "$DEST"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeakToSurvive-APK
          path: app/build/outputs/apk/debug/app-debug.apk
